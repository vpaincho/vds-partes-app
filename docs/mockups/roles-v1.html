<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VDS · Mockups por rol</title>
<style>
:root{color-scheme:dark;--bg:#10171e;--panel:#18212a;--line:#31404d;--muted:#a7b8c7;--red:#c21f35;--blue:#9ec8ef;--green:#63c69a;--orange:#f3b35c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf2f6;font:16px/1.45 'Segoe UI',Arial,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:transparent;padding:10px 15px;min-height:46px}button:hover{background:#263642}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:3px}input,select,textarea{width:100%;border:1px solid #405260;border-radius:6px;background:#111c25;padding:11px;margin-top:5px;min-height:46px}input[type=checkbox]{width:22px;min-height:22px;accent-color:var(--red);margin:0}label{display:block;font-size:14px;color:var(--muted)}textarea{min-height:85px;resize:vertical}h1{font-size:24px;margin:0}h2{font-size:19px;margin:0 0 16px}h3{font-size:16px;margin:0 0 8px}p{margin:8px 0}small,.muted{color:var(--muted);font-size:14px}.lab{padding:9px 20px;background:#233244;display:flex;gap:16px;align-items:center;flex-wrap:wrap}.roles{display:flex;gap:6px;flex-wrap:wrap}.roles button{min-height:38px;padding:6px 14px}.roles button[aria-pressed=true]{background:#edf2f6;color:#13212c}.head{padding:18px 24px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:20px;align-items:center}.grow{flex:1}.tag{font-size:13px;border:1px solid var(--line);border-radius:4px;padding:3px 7px;display:inline-block}.warn{color:var(--orange)}.ok{color:var(--green)}.context{padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:26px;flex-wrap:wrap;font-size:14px}.steps{display:flex;gap:6px;padding:10px 20px;background:var(--panel);position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line)}.steps button{flex:1;text-align:left;border:0;color:var(--muted)}.steps button[aria-current=step]{background:#0e171e;color:white;border-left:4px solid var(--red)}main{padding:22px 24px 110px;max-width:1600px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.stack{display:grid;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.source{font-size:12px;color:var(--blue);display:block;margin-top:4px}.check{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:7px;color:#edf2f6;margin:9px 0;min-height:54px}.check small{display:block}dl{display:grid;grid-template-columns:130px 1fr;gap:10px;font-size:14px}dt{color:var(--muted)}dd{margin:0}details{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}summary{cursor:pointer;padding:6px 0;color:var(--blue);min-height:44px}.primary{background:var(--red);border-color:var(--red);color:#fff}.primary:hover{background:#a7192d}.footer{position:fixed;bottom:0;left:0;right:0;padding:12px 24px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;z-index:3}.notice{border-left:3px solid var(--orange);padding:10px 14px;background:#24303a;margin:12px 0;font-size:14px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:14px 10px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.kpi b{display:block;font-size:26px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.job{display:block;width:100%;text-align:left;background:var(--panel);margin:10px 0;padding:16px}.job b,.job small{display:block}.selected{border-color:var(--blue)}.workspace{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:20px}.side{position:sticky;top:15px}.toolbar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.toolbar button[aria-pressed=true]{background:#2b3b4a;color:#fff}.meters>div{display:grid;grid-template-columns:100px 1fr 55px;gap:12px;align-items:center;margin:17px 0;font-size:14px}meter{width:100%;height:18px}.toast{position:fixed;bottom:85px;right:20px;background:#264939;color:#fff;padding:15px;border-radius:8px;z-index:5;max-width:400px}.brand{font-weight:700;letter-spacing:1px}.brand small{font-weight:400;letter-spacing:0;display:block}dialog{background:var(--panel);color:#edf2f6;border:1px solid var(--line);border-radius:12px;width:min(650px,90vw);max-height:80vh}dialog::backdrop{background:#0009}#close{float:right}@media(max-width:950px){.workspace{grid-template-columns:1fr}.side{position:static}.kpis{grid-template-columns:1fr 1fr}.head{flex-wrap:wrap}.grid{grid-template-columns:1fr}}@media(max-width:600px){main{padding:16px 12px 130px}.context{gap:12px;padding:12px}.steps{padding:8px;overflow:auto}.steps button{font-size:14px;min-width:115px}.fields{grid-template-columns:1fr}.board{grid-template-columns:1fr}.head{padding:15px 12px}.footer{padding:10px 12px;flex-wrap:wrap}.footer small{display:none}.kpis{gap:8px}.card{padding:16px}dl{grid-template-columns:100px 1fr}}
</style>
<div class="lab"><strong>Mockup de evaluación</strong><span class="muted">Datos ilustrativos · las acciones no modifican la aplicación</span><div class="grow"></div><nav class="roles" aria-label="Elegir rol"></nav></div><div id="app"></div><dialog id="dialog"><button id="close" aria-label="Cerrar">Cerrar</button><div id="dialogContent"></div></dialog><div class="toast" hidden role="status"></div>
<script>
const roles=['Operario','Planner','Cliente','Admin'],sections=['Inicio','Personal','Equipos','Tareas y tiempos','Cierre'];let role='Operario',step=0,planner='Planificación',selected='PL-092',clientStatus='Para revisar',adminTab='Mejoras',saved={};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const field=(name,title,value='',type='text',source='')=>`<label>${title}<input name="${name}" value="${esc(saved[name]??value)}" type="${type}">${source?`<span class="source">${source}</span>`:''}</label>`;
const check=(name,text,note='')=>`<label class="check"><input type="checkbox" name="${name}" ${saved[name]?'checked':''}><span>${text}${note?`<small>${note}</small>`:''}</span></label>`;
const card=(title,body)=>`<section class="card"><h2>${title}</h2>${body}</section>`;
function head(title,sub,extra=''){return `<header class="head"><div class="brand">VIENTOS DEL SUR<small>Desarrollado por Friquarks</small></div><div class="grow"><h1>${title}</h1><small>${sub}</small></div>${extra}</header>`}
function tabs(items,active,action){return `<nav class="toolbar">${items.map(x=>`<button data-${action}="${x}" aria-pressed="${active===x}">${x}</button>`).join('')}</nav>`}
function operator(){let content='';if(step===0)content=`<div class="grid"><div class="stack">${card('Lo planificado',`<dl><dt>Servicio</dt><dd>Servicios de cuadrilla en locaciones</dd><dt>Trabajo</dt><dd>PL-092 · día 1 de 5</dd><dt>Locación</dt><dd>El Trébol · Batería ET-B3</dd><dt>Tareas</dt><dd>Limpieza de locación · m²<br>Montaje de línea · m<br>Movimiento de suelo · m³</dd><dt>Indicaciones</dt><dd>Ingresar por picada 14. Coordinar firma con supervisor.</dd><dt>Responsable</dt><dd>Martín Sosa</dd></dl><details><summary>Revisar datos del trabajo</summary>${field('location','Locación','El Trébol · Batería ET-B3','text','Planificación · corrección a revisar por planner')}${field('instructions','Indicaciones','Ingresar por picada 14.','text','Planificación · editable en el parte')}</details>`)}${card('Llegada a la instalación',field('arrival','Hora de llegada','','time','Completar hoy'))}${card('Reserva de materiales',`<div class="row"><strong>RS-20481</strong><span class="tag">Pendiente de retiro</span></div><p>12 caños de 2″ · retiro en almacén central.</p><small>Cargado por planner · ejemplo de referencia de la operadora</small><details><summary>Materiales e instrucciones</summary><p>Verificar cantidades antes de retirar. El código de reserva proviene de la operadora.</p><button data-dialog="material">Informar diferencia o retiro</button></details>`)}</div><div class="stack">${card('Condiciones climáticas',`<div class="fields">${field('temp','Temperatura °C','','number')}${field('wind','Viento km/h','','number')}${field('gust','Ráfagas km/h','','number')}</div><div class="notice">Sin fuente conectada. Cargá la observación de hoy.</div><details><summary>Dirección, condición y fuente</summary>${field('direction','Dirección')}${field('weatherNote','Observación')}</details>`)}${card('Antes de empezar',check('talk','Charla de seguridad realizada','Confirmación de hoy')+check('ppe','EPP verificado','Confirmación de hoy'))}${card('Permiso de trabajo de la operadora',`<div class="fields">${field('permit','Número de permiso')}${field('signer','Firmó')}${field('permitTime','Hora de firma','','time')}</div><p class="warn">Pendiente de completar y confirmar</p>`)}${card('Disponibilidad documental',`<p class="warn">MB-08 · revisar habilitación antes de movilizar</p><button data-dialog="document">Ver requisito y responsable</button><small class="source">Consulta contextual · ejemplo de aviso</small>`)}</div></div>`;
if(step===1)content=card('Personal asignado',`<div class="row"><p class="grow">Cuadrilla C-03 · 4 personas planificadas</p><button data-dialog="person">Agregar o reemplazar</button></div><div class="table-wrap"><table><tr><th>Persona</th><th>Presencia de hoy</th><th>Ingreso a base</th><th>Llegada a zona</th><th>Salida</th></tr>${['Diego Arce','Cristian Paz','Lucas Villegas','Ramón Ojeda'].map((n,i)=>`<tr><td>${n}<span class="source">Planificación</span></td><td>${check('present'+i,'Presente')}</td><td>${field('base'+i,'','06:30','time','Sugerencia anterior')}</td><td>${field('zone'+i,'','','time')}</td><td>${field('out'+i,'','','time')}</td></tr>`).join('')}</table></div><details><summary>Aplicar un horario común</summary><p>Se aplica a las personas que confirmaste presentes; podés corregir cada fila.</p><div class="fields">${field('commonBase','Ingreso a base','','time')}${field('commonZone','Llegada a zona','','time')}${field('commonOut','Salida','','time')}</div><button data-common>Aplicar a presentes</button></details>`);
if(step===2)content=card('Equipos asignados',`<div class="grid">${['PU-31 · Pick-up Hilux','MB-08 · Minibús'].map((n,i)=>`<div><h3>${n}</h3><span class="source">Planificación · editable</span>${check('equipment'+i,'Confirmo uso hoy')}${field('km'+i,'Lectura actual','','number','Última lectura: '+(i?'120.200':'84.000')+' · referencia, no lectura de hoy')}<button data-dialog="equipment">Cambiar equipo / informar novedad</button></div>`).join('')}</div>`);
if(step===3)content=`<div class="stack">${card('Tareas y tiempos',`<p class="muted">Las tareas previstas están listas para completar. No cuentan como ejecutadas hasta registrarlas.</p><div class="table-wrap"><table><tr><th>Actividad</th><th>Desde</th><th>Hasta</th><th>Cantidad</th><th>Evidencia</th></tr>${['Limpieza de locación · m²','Montaje de línea · m','Movimiento de suelo · m³'].map((n,i)=>`<tr><td>${n}<span class="source">Planificación</span></td><td>${field('from'+i,'','','time')}</td><td>${field('to'+i,'','','time')}</td><td>${field('qty'+i,'','','number')}</td><td><button data-dialog="evidence">Adjuntar</button></td></tr>`).join('')}</table></div><div class="row" style="margin-top:15px"><button data-dialog="activity">Agregar actividad</button><button data-dialog="wait">Espera / traslado / viento</button><button data-dialog="extra">Solicitar adicional</button></div>`)}${card('Novedades de la jornada',`<p>No se cargaron novedades en esta maqueta.</p><button data-dialog="issue">Registrar novedad o bloqueo</button>`)}</div>`;
if(step===4)content=`<div class="grid">${card('Revisión y cierre',`<h3>Resultado del trabajo</h3><label>Estado<select name="finish"><option>Continúa</option><option>Finalizado</option><option>Necesita más días</option></select></label><label>Pendientes para el relevo<textarea name="handover">${esc(saved.handover||'')}</textarea></label><details><summary>Consultar bitácora y relevo anterior</summary><p>Los registros de jornadas anteriores se consultan aquí, sin reemplazar el cierre de hoy.</p></details><button data-dialog="signature">Firmar parte</button>`)}${card('Controles antes de enviar',`<div id="review"></div><p class="muted">En la app real se conservarán todos los controles de habilitación, datos y firma del circuito original.</p><button data-review>Recalcular revisión</button>`)}</div>`;
return head('Parte diario','PD-0397 · 9 oct · PL-092 · día 1 de 5',`<span class="tag warn">En curso</span><button data-dialog="switch">Cambiar parte</button>`)+`<div class="context"><span>Contrato <b>CT-AUP-017</b></span><span>Imputación <b>AUP-4110-CAPEX-07</b></span><span>Cliente <b>Austral Petróleo</b></span><span>Supervisor <b>Pablo Ortiz</b></span></div><nav class="steps" aria-label="Secciones del parte">${sections.map((s,i)=>`<button data-step="${i}" ${step===i?'aria-current="step"':''}>${i+1} · ${s}</button>`).join('')}</nav><main>${content}</main><footer class="footer"><span class="grow"><small>Maqueta · cambios solo en esta sesión</small></span>${step?`<button data-step="${step-1}">Anterior</button>`:''}<button data-save>Guardar borrador</button>${step<4?`<button class="primary" data-step="${step+1}">${sections[step+1]}</button>`:'<button class="primary" data-send>Revisar y enviar</button>'}</footer>`}
const jobs=[{id:'PL-092',place:'El Trébol · ET-B3',res:'C-03',status:'En ejecución',note:'Reserva pendiente de retiro'},{id:'PL-094',place:'Cañadón Seco · CS-14',res:'C-05',status:'Por preparar',note:'Permiso de ingreso pendiente'},{id:'PL-096',place:'El Trébol · ET-B5',res:'HG-14',status:'Por preparar',note:'Revisar documentación'}];
function plannerView(){const job=jobs.find(j=>j.id===selected);return head('Planificación','Viernes 9 de octubre · Cuenca Golfo San Jorge',`<button data-dialog="newwork" class="primary">Nuevo trabajo</button>`)+`<main>${tabs(['Planificación','Revisión de partes','Análisis operativo'],planner,'planner')}${planner==='Planificación'?`<div class="workspace"><div><div class="row"><label>Fecha<input type="date" value="2026-10-09"></label><label>Operadora<select><option>Todas las operadoras</option><option>Austral Petróleo</option></select></label><button data-dialog="filters">Más filtros</button></div><div class="board">${['C-03 · Cuadrilla','C-05 · Cuadrilla','HG-14 · Hidrogrúa'].map((r,i)=>`<section><h3 style="margin-top:20px">${r}</h3>${jobs.filter(j=>j.res===r.split(' · ')[0]).map(j=>`<button class="job ${j.id===selected?'selected':''}" data-job="${j.id}"><span class="tag">${j.status}</span><b>${j.id} · ${j.place}</b><small>07:30 – 18:30 · ventana ilustrativa</small><p class="warn">${j.note}</p></button>`).join('')}<button data-dialog="assign">Asignar trabajo</button></section>`).join('')}</div></div><aside class="side card"><span class="tag">${job.id}</span><h2 style="margin-top:12px">${job.place}</h2>${tabs(['Preparación','Ejecución','Historial'],'Preparación','detail')}<dl><dt>Recurso</dt><dd>${job.res}</dd><dt>Responsable</dt><dd>Martín Sosa</dd><dt>Estado</dt><dd>${job.status}</dd></dl><div class="notice">${job.note}</div><button data-dialog="material">Gestionar reserva</button><button data-dialog="document">Revisar documentos</button><details open><summary>Tareas y condiciones</summary><p>Limpieza y montaje. Coordinar ingreso con supervisor de la operadora.</p><button data-dialog="editwork">Editar planificación</button></details><details><summary>Reutilizar planificación</summary><button data-dialog="copy">Preparar trabajo nuevo</button></details></aside></div>`:planner==='Revisión de partes'?card('Partes para resolver',`<table><tr><th>Parte</th><th>Trabajo</th><th>Situación</th><th>Acción</th></tr><tr><td>PD-0396</td><td>PL-091 · C-03</td><td>Enviado · revisar cantidades</td><td><button data-dialog="part">Abrir parte y evidencia</button></td></tr><tr><td>PD-0395</td><td>PL-090 · C-05</td><td>Observado · corrección pendiente</td><td><button data-dialog="part">Ver observación</button></td></tr></table>`):analytics()}</main>`}
function analytics(){return `<div class="notice">Escenario ilustrativo · período 5–9 oct · comparar actividades y condiciones equivalentes.</div><div class="kpis">${[['Cobertura de partes','18 / 20'],['Tiempo operativo','62 h'],['Esperas registradas','12 h'],['Traslados','9 h']].map(([a,b])=>card(a,`<div class="kpi"><b>${b}</b></div>`)).join('')}</div><div class="grid">${card('Dónde se consume tiempo',`<div class="meters">${[['Operación',62],['Espera',12],['Traslado',9],['Viento',5]].map(([a,b])=>`<div><span>${a}</span><meter min="0" max="88" value="${b}"></meter><b>${b} h</b></div>`).join('')}</div><button data-dialog="cause">Abrir partes que explican la demora</button>`)}${card('Acciones para revisar',`<h3>Coordinar permisos antes de movilizar</h3><p>Ejemplo: 4 registros concentran 6 h de espera por firma.</p><button data-dialog="cause">Ver evidencia y trabajos</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Confirmar el retiro de la reserva</h3><p>PL-092 · pedido todavía pendiente de retiro.</p><button data-job="PL-092">Abrir preparación</button><small class="source">Una sugerencia requiere revisión del planner; no representa un ahorro demostrado.</small>`)}</div>`}
function client(){return head('Revisión de partes','Austral Petróleo · contratos asignados',`<span class="tag">Cliente</span>`)+`<main><div class="workspace"><div>${card('Pendientes de revisión',`<label>Contrato<select><option>CT-AUP-017 · Cuadrillas</option></select></label><button class="job selected" data-client="PD-0396"><b>PD-0396 · PL-091</b><small>8 oct · El Trébol · ET-B3</small><p>${clientStatus}</p></button><button class="job" data-client="PD-0394"><b>PD-0394 · PL-089</b><small>8 oct · El Trébol · ET-B5</small><p>Para revisar</p></button>`)}${card('Seguimiento contractual',`<p>Partes revisados y certificados se consultan desde el mismo contrato.</p><button data-dialog="contract">Ver período y estado de certificación</button>`)}</div><aside class="card"><span class="tag">PD-0396 · ejemplo</span><h2 style="margin-top:12px">Resumen de ejecución</h2><dl><dt>Contrato</dt><dd>CT-AUP-017</dd><dt>Imputación</dt><dd>AUP-4110-CAPEX-07</dd><dt>Trabajo</dt><dd>Limpieza de locación</dd></dl><table><tr><th>Actividad</th><th>Cantidad</th></tr><tr><td>Limpieza de locación</td><td>450 m²</td></tr><tr><td>Montaje de línea</td><td>20 m</td></tr></table><details open><summary>Evidencia y trazabilidad</summary><button data-dialog="evidence">Consultar evidencia de actividad</button><p>Enviado por Diego Arce · revisado por planner.</p></details><label>Observación<textarea name="clientNote">${esc(saved.clientNote||'')}</textarea></label><div class="row" style="margin-top:15px"><button data-observe>Solicitar corrección</button><button class="primary" data-certify>Certificar parte</button></div><small class="source">Decisiones simuladas · sin efecto contractual</small></aside></div></main>`}
function admin(){return head('Centro de producto','Mejora de la aplicación · separado del análisis operativo',`<button data-dialog="opportunity" class="primary">Registrar mejora</button>`)+`<main>${tabs(['Mejoras','Uso y fricción','Usuarios y configuración'],adminTab,'admin')}${adminTab==='Usuarios y configuración'?`<div class="grid">${card('Usuarios y accesos',`<p>Gestionar roles, asignaciones y permisos específicos.</p><button data-dialog="users">Abrir gestión de usuarios</button>`)}${card('Empresa y funcionalidades',`<p>Logo, identidad, módulos y política documental de esta instalación.</p><button data-dialog="brand">Configurar empresa</button><button data-dialog="modules">Revisar módulos</button>`)}</div>`:`<div class="notice">Métricas ilustrativas para evaluar la interfaz; no representan mediciones de la app.</div><div class="kpis">${[['Carga mediana','1 min 42 s'],['90% de las cargas','2 min 38 s'],['Error de guardado','2 eventos'],['Envíos medidos','32']].map(([a,b])=>card(a,`<div class="kpi"><b>${b}</b></div>`)).join('')}</div><div class="workspace">${card(adminTab==='Mejoras'?'Qué conviene mejorar':'Puntos de fricción',`<table><tr><th>Señal</th><th>Evidencia ilustrativa</th><th>Estado</th></tr><tr><td><button data-dialog="improvement">Carga repetida de horarios</button></td><td>14 cargas con correcciones en Personal</td><td>En evaluación</td></tr><tr><td><button data-dialog="improvement">Fallo de guardado</button></td><td>2 errores · contexto por revisar</td><td>Prioritaria</td></tr><tr><td><button data-dialog="improvement">Evidencia difícil de encontrar</button></td><td>5 devoluciones de prueba</td><td>Por validar</td></tr></table>`)}${card('Evaluar una mejora',`<h3>Aplicar horarios comunes con edición individual</h3><p><b>Problema:</b> carga repetida dentro del parte.</p><p><b>Hipótesis:</b> reducir interacciones sin aumentar errores.</p><p><b>Validación:</b> comparar tiempo total, correcciones y partes devueltos.</p><p class="muted">El objetivo de dos minutos se comprueba en campo. Prioridad y rentabilidad requieren valorar frecuencia, impacto, esfuerzo y costo.</p><button data-dialog="improvement">Revisar evidencia y resultado</button>`)}</div>`}</main>`}
function render(){document.querySelector('.roles').innerHTML=roles.map(r=>`<button data-role="${r}" aria-pressed="${r===role}">${r}</button>`).join('');$('#app').innerHTML=role==='Operario'?operator():role==='Planner'?plannerView():role==='Cliente'?client():admin();if(step===4&&role==='Operario')review()}
function toast(t){$('.toast').textContent=t;$('.toast').hidden=false;setTimeout(()=>$('.toast').hidden=true,4000)}
function review(){const list=[['arrival','Llegada registrada'],['talk','Charla de seguridad confirmada'],['ppe','EPP confirmado'],['permit','Permiso registrado'],['signature','Firma confirmada en maqueta']];$('#review').innerHTML=list.map(([k,l])=>`<p class="${saved[k]?'ok':'warn'}">${saved[k]?'Completo':'Pendiente'} · ${l}</p>`).join('');return list.every(([k])=>saved[k])}
const dialogs={material:['Reserva y materiales','Pedido, reserva, instrucciones y movimientos se consultan aquí en contexto del trabajo.','Diferencia o retiro informado'],document:['Requisito documental','Recurso MB-08 · habilitación por revisar · responsable: Control documental. El operario consulta y puede informar una novedad.','Novedad documental'],evidence:['Evidencia de actividad','La evidencia queda asociada al tramo y al trabajo. Esta maqueta no carga archivos.','Descripción de evidencia'],person:['Cambio de cuadrilla','Registrar presencia, ausencia o reemplazo con revisión de habilitaciones.','Persona y motivo'],equipment:['Cambio o novedad de equipo','La lectura anterior es referencia; la actual corresponde a hoy.','Equipo y motivo'],activity:['Nueva actividad','Registrar categoría, tarea, cantidad, unidad y tramo horario.','Actividad'],wait:['Tiempo no operativo','Seleccionar espera, traslado o viento e identificar el motivo.','Motivo'],extra:['Solicitud de adicional','Separar lo solicitado de lo aprobado y de lo certificable.','Solicitud'],issue:['Novedad o bloqueo','Registrar responsable, gravedad y acción necesaria en el contexto del trabajo.','Novedad'],signature:['Firma de cierre','En el código final se conserva la firma original. Aquí solo se simula su confirmación.','Nombre'],switch:['Cambiar parte','Acceso breve a trabajos asignados cuando haya más de uno, sin duplicar la pantalla de carga.','Trabajo'],improvement:['Mejora del producto','Seguir evidencia, hipótesis, esfuerzo, responsable y resultados observados.','Comentario'],cause:['Evidencia operativa','Desglosar partes, locaciones, tareas y causas antes de recomendar una intervención.','Acción a revisar']};
function dialog(key){const [title,description,label]=dialogs[key]||['Detalle contextual','Este acceso representa el panel correspondiente. Su flujo se afina antes de integrar el código.','Comentario'];$('#dialogContent').innerHTML=`<h2>${title}</h2><p>${description}</p>${field('dialogNote',label)}<button class="primary" data-dialog-save="${key}" style="margin-top:16px">${key==='signature'?'Confirmar firma simulada':'Registrar en maqueta'}</button>`;$('#dialog').showModal()}
document.addEventListener('input',e=>{if(e.target.name)saved[e.target.name]=e.target.type==='checkbox'?e.target.checked:e.target.value});document.addEventListener('change',e=>{if(e.target.name)saved[e.target.name]=e.target.type==='checkbox'?e.target.checked:e.target.value});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.role){role=d.role;render()}else if(d.step!==undefined){step=Number(d.step);render();window.scrollTo(0,0)}else if(d.planner){planner=d.planner;render()}else if(d.admin){adminTab=d.admin;render()}else if(d.job){selected=d.job;planner='Planificación';render()}else if(d.detail){dialog(d.detail)}else if(d.dialog){dialog(d.dialog)}else if(d.dialogSave){if(d.dialogSave==='signature')saved.signature=true;$('#dialog').close();render();toast('Registrado solo en la maqueta')}else if(b.id==='close')$('#dialog').close();else if('save'in d)toast('Borrador conservado durante esta sesión de maqueta');else if('review'in d)review();else if('send'in d){if(review())toast('Envío simulado · el parte real no fue modificado');else toast('Completá los pendientes de la revisión')}else if('common'in d){let n=0;for(let i=0;i<4;i++)if(saved['present'+i]){for(const [a,c]of [['base','commonBase'],['zone','commonZone'],['out','commonOut']])if(saved[c])saved[a+i]=saved[c];n++}render();toast(n?'Horarios aplicados a '+n+' personas confirmadas':'Confirmá primero las personas presentes')}else if('observe'in d){if(!saved.clientNote?.trim())toast('Indicá el motivo de la corrección');else{clientStatus='Corrección solicitada · simulación';render();toast('Decisión simulada')}}else if('certify'in d){clientStatus='Certificado · simulación';render();toast('Certificación simulada')}else if(d.client)dialog('part')});render();
</script></html>
